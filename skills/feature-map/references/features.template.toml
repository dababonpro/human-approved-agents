# Feature map. Keep it small: the 5 to 10 flows that would hurt most if they broke.

[settings]
# Start narrow: only the folders of the flows you mapped. Everything else is visibly out of scope.
# Files here must belong to a feature, or a change to them fails the check.
mapped_paths = ["src/orders/**"]
# Deliberately out of scope. Listing them keeps the gap visible.
ignore = ["src/orders/generated/**"]
# Deleting these, or adding a skip marker to them, needs a person.
test_paths = ["tests/**"]
# Seconds allowed for each proof command.
proof_timeout = 600

[[feature]]
id = "example-feature"
owner = "name"
# Behaviour a user or system would notice, not implementation detail.
must_stay_true = [
    "A submitted order appears exactly once",
    "A failed write is reported as a failure",
]
# Everything that can break it, including config and infrastructure.
code = ["src/orders/**", "infra/orders/**"]
# Commands that check the promises above. Each must pass on clean code, and must fail when the feature is broken.
# End with a count of tests run, and do not pipe them.
proof = ["python -m unittest tests.test_orders"]
