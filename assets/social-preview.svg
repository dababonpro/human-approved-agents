<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640" role="img" aria-labelledby="t d">
  <title id="t">The Human-Approved Agent Playbook</title>
  <desc id="d">Social preview: an agent's action passes rules the agent reads, limits it cannot cross, and people who check.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="1280" height="640" fill="#F6F8FB"/>
  <rect x="0" y="0" width="1280" height="10" fill="#2563EB"/>

  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="96" y="196" font-size="20" font-weight="600" letter-spacing="2.5" fill="#2563EB">FREE GUIDE · TEMPLATES · AGENT SKILLS</text>
    <text x="96" y="282" font-size="62" font-weight="700" fill="#0F172A">The Human-Approved</text>
    <text x="96" y="356" font-size="62" font-weight="700" fill="#0F172A">Agent Playbook</text>
    <text x="96" y="420" font-size="26" fill="#475569">Rules the agent reads. Limits it cannot cross.</text>
    <text x="96" y="456" font-size="26" fill="#475569">People who check.</text>
    <text x="96" y="560" font-size="20" fill="#64748B">DababonPro IT Solutions · CC BY 4.0 and MIT</text>
  </g>

  <!-- The hero's gates, scaled and moved to the right half -->
  <g transform="translate(235,167) scale(0.85)">
    <line x1="712" y1="180" x2="1100" y2="180" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow)"/>
    <circle cx="712" cy="180" r="10" fill="#2563EB"/>

    <rect x="770" y="104" width="64" height="152" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="3" stroke-dasharray="10 8"/>
    <path d="M790 150 h24 M790 166 h24 M790 182 h16" stroke="#2563EB" stroke-width="4" stroke-linecap="round"/>

    <rect x="888" y="104" width="64" height="152" rx="14" fill="#DBEAFE" stroke="#2563EB" stroke-width="3"/>
    <rect x="905" y="168" width="30" height="24" rx="4" fill="#2563EB"/>
    <path d="M911 168 v-8 a9 9 0 0 1 18 0 v8" fill="none" stroke="#2563EB" stroke-width="4"/>

    <rect x="1006" y="104" width="64" height="152" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="3"/>
    <circle cx="1038" cy="160" r="10" fill="#2563EB"/>
    <path d="M1020 196 a18 16 0 0 1 36 0 z" fill="#2563EB"/>

    <circle cx="1132" cy="180" r="22" fill="#16A34A"/>
    <path d="M1121 181 l7 7 l14 -15" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="19" fill="#475569" text-anchor="middle">
      <text x="712" y="150">Action</text>
      <text x="802" y="290">Rules</text>
      <text x="920" y="290">Limits</text>
      <text x="1038" y="290">People</text>
      <text x="1132" y="236">Done</text>
    </g>
  </g>
</svg>
