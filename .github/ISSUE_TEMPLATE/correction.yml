name: Correction or feedback
description: Report an error, an outdated claim, or something unclear in the guide, templates or skills.
labels: [correction]
body:
  - type: input
    id: where
    attributes:
      label: Where
      description: The file and section, or a link to the line.
      placeholder: playbook/playbook.md, section 5
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What is wrong or unclear
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Source or evidence
      description: Say what kind it is (law, standard, guidance, study, vendor data or experience) and link it.
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
  - type: checkboxes
    id: privacy
    attributes:
      label: Before you submit
      options:
        - label: This issue contains no real company names, staff, customer data or secrets.
          required: true
