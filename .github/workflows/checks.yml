name: checks
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Feature map check script tests
        run: python -m unittest discover -s skills/feature-map/scripts -p "test_*.py"
      - name: Links
        run: python tools/check_links.py
      - name: Agent files
        run: python tools/check_agent_files.py
      - name: Harness
        run: python tools/check_harness.py
      - name: Feature map
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # The base branch's copy judges the change. On first adoption the branch's copy is used once.
          # No --promises-approved: that needs required review by a second person, and this repository has one
          # maintainer. A change that weakens the map fails here, and the maintainer handles it by hand.
          SCRIPT=skills/feature-map/scripts/check_feature_map.py
          git show "$BASE_SHA:$SCRIPT" > "$RUNNER_TEMP/check.py" || cp "$SCRIPT" "$RUNNER_TEMP/check.py"
          python "$RUNNER_TEMP/check.py" --base "$BASE_SHA" --run | tee -a "$GITHUB_STEP_SUMMARY"
          exit "${PIPESTATUS[0]}"

# The private-terms scan runs on the maintainer's machine before each commit, not here: its list of names is
# private, so it stays in a git-ignored file and never reaches GitHub.
